name: Weekly Briefing Mail
on:
  schedule:
    - cron: "0 1 * * 5"      # 每周五 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:          # 允许在网页上手动触发

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate original-page screenshot
        run: |
          LATEST=$(ls legacy/w*-*.html | sort -V | tail -n 1)
          BROWSER=$(command -v chromium || command -v chromium-browser || command -v google-chrome)
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --virtual-time-budget=3000 --window-size=1280,1800 \
            --screenshot="$PWD/data/briefing-preview.png" "file://$PWD/$LATEST"
          test -s data/briefing-preview.png
      - run: python scripts/send_mail.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
