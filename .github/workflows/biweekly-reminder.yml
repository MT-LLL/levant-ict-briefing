name: Biweekly reminder

# 每双周一 UTC 05:00 (巴格达时间 08:00) 检查是否该出新期
on:
  schedule:
    - cron: '0 5 * * 1'  # 每周一 UTC 5:00
  workflow_dispatch:     # 支持手动触发测试

jobs:
  check-and-remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check if new issue due
        id: check
        run: python scripts/check_issue_due.py
      
      - name: Create reminder issue
        if: steps.check.outputs.due == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const nextWeeks = '${{ steps.check.outputs.next_weeks }}' || 'N-N+1';
            const msg = `${{ steps.check.outputs.message }}`;
            
            // 检查是否已有待办提醒 issue 避免重复
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'biweekly-reminder',
              state: 'open'
            });
            
            if (existing.length > 0) {
              console.log(`已有 ${existing.length} 个待办提醒, 跳过创建`);
              return;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📅 该出第 ${nextWeeks} 周双周简报了`,
              body: [
                `## 🔔 双周简报提醒`,
                ``,
                msg,
                ``,
                `### 下一步操作`,
                ``,
                `1. **Auto draft briefing** 工作流会在今天稍晚自动运行（也可到 Actions 手动触发）：自动采集素材、起草 **第 ${nextWeeks} 周** 简报、校验通过后自动合并并部署`,
                `2. 发布后抽查内容（重点核对真实性、链接、KPI 数字）；有问题在 main 历史 revert 合并提交或修正 \`legacy/\` 中对应 HTML 后推送`,
                ``,
                `完成后关闭此 Issue 即可。`,
                ``,
                `---`,
                `*自动提醒 · 发送人: 李辉 00621351*`
              ].join('\n'),
              labels: ['biweekly-reminder', 'automation']
            });
            
            console.log('✅ 提醒 Issue 已创建');
