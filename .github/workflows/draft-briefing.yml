name: Auto draft briefing

# 半自动出刊流水线：
#   定时/手动触发 → 检查是否到期 → 采集素材 → LLM 起草简报 → 自动建 PR → 人工审阅合并 → pages.yml 自动部署
# 定时任务只在"到期"时执行；手动触发（workflow_dispatch）视为有意为之，强制执行。

on:
  schedule:
    - cron: '0 6 * * 1'   # 每周一 UTC 06:00（巴格达 09:00 / 北京 14:00）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # 用于自动创建 auto-draft 标签

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser beautifulsoup4 lxml requests

      - name: Check if new issue due
        id: check
        run: python scripts/check_issue_due.py

      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.check.outputs.due }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "未到出刊时间，跳过。需要强制执行请用 workflow_dispatch 手动触发。"
          fi

      - name: Collect raw material
        if: steps.gate.outputs.run == 'true'
        run: python scripts/collect.py

      - name: Draft briefing via LLM
        if: steps.gate.outputs.run == 'true'
        id: draft
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/draft_briefing.py

      - name: Push branch and open PR
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.draft.outputs.issue }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/briefing-${ISSUE}"
          git checkout -B "$BRANCH"
          git add "legacy/${ISSUE}.html" data/raw/
          git commit -m "auto: ${ISSUE} 双周简报草稿（AI 生成，待人工审阅）"
          git push -f -u origin "$BRANCH"
          gh label create "auto-draft" --color "7C3AED" --description "AI 自动起草，待人工审阅" --force || true
          gh pr create \
            --title "📰 ${ISSUE} 双周简报草稿（AI 生成，待审阅）" \
            --body "$(cat <<'EOF'
          ## 🤖 自动起草说明

          本 PR 由 **Auto draft briefing** 工作流生成：

          1. `scripts/collect.py` 采集 Google News RSS + Telegram 公开频道素材（见 `data/raw/`）
          2. `scripts/draft_briefing.py` 调用 LLM 以上一期为结构模板生成本期 HTML
          3. 结构校验已通过（必需标记齐全）

          ## ✅ 合并前请人工审阅

          - [ ] 新闻条目真实、与三国 ICT 相关，无编造内容
          - [ ] 链接可打开、指向正确来源
          - [ ] KPI 数字与条目数一致
          - [ ] 期号、日期、统计周期正确
          - [ ] 商机与合规内容表述恰当

          合并后 `pages.yml` 会自动构建并部署到 GitHub Pages。
          EOF
          )" \
            --label "auto-draft" || echo "PR 可能已存在，分支已更新：$BRANCH"
