name: Auto draft briefing

# 全自动出刊流水线：
#   定时/手动触发 → 检查是否到期 → 采集素材 → LLM 起草简报 → 结构校验 → 建 PR → 自动合并 → 触发部署
# 校验不通过则整轮失败、不会产生 PR；合并后可随时在 History 中回退。
# 定时任务只在"到期"时执行；手动触发（workflow_dispatch）视为有意为之，强制执行。

on:
  schedule:
    - cron: '0 6 * * 1'   # 每周一 UTC 06:00（巴格达 09:00 / 北京 14:00）
  workflow_dispatch:
    inputs:
      issue:
        description: '指定期号（如 37-38），留空则自动计算下一期'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write   # 用于自动创建 auto-draft 标签
  actions: write  # 合并后触发 pages.yml 部署（GITHUB_TOKEN 的合并不会自动触发 push 事件）

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser beautifulsoup4 lxml requests

      - name: Check if new issue due
        id: check
        run: python scripts/check_issue_due.py

      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.check.outputs.due }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "未到出刊时间，跳过。需要强制执行请用 workflow_dispatch 手动触发。"
          fi

      - name: Collect raw material
        if: steps.gate.outputs.run == 'true'
        run: python scripts/collect.py

      - name: Draft briefing via LLM
        if: steps.gate.outputs.run == 'true'
        id: draft
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ISSUE_OVERRIDE: ${{ github.event.inputs.issue }}
        run: |
          if [ -n "$ISSUE_OVERRIDE" ]; then
            echo "指定期号：$ISSUE_OVERRIDE"
            python scripts/draft_briefing.py --issue "$ISSUE_OVERRIDE"
          else
            python scripts/draft_briefing.py
          fi

      - name: Push branch and open PR
        if: steps.gate.outputs.run == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.draft.outputs.issue }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/briefing-${ISSUE}"
          git checkout -B "$BRANCH"
          git add "legacy/${ISSUE}.html" data/raw/
          git commit -m "auto: ${ISSUE} 双周简报（AI 生成）"
          git push -f -u origin "$BRANCH"
          gh label create "auto-draft" --color "7C3AED" --description "AI 自动起草" --force || true
          PR_URL=$(gh pr create \
            --title "auto: ${ISSUE} 双周简报（AI 自动生成）" \
            --body "$(cat <<'EOF'
          ## 🤖 自动起草说明

          本 PR 由 **Auto draft briefing** 工作流生成并将**自动合并**：

          1. `scripts/collect.py` 采集 Google News RSS + Telegram 公开频道素材（见 `data/raw/`）
          2. `scripts/draft_briefing.py` 调用 LLM 以上一期为结构模板生成本期 HTML
          3. 结构校验已通过（必需标记齐全）后方才建 PR

          合并后自动触发 `pages.yml` 部署到 GitHub Pages。

          ## 🔍 事后审阅与回退

          如内容有问题，可直接在 main 历史里 revert 本次 squash 合并提交，或编辑 `legacy/` 中对应期号 HTML 后推送。
          EOF
          )" \
            --label "auto-draft" 2>/dev/null) || PR_URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')
          echo "PR: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Auto-merge PR and trigger deploy
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          MERGED=0
          for i in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --squash --delete-branch; then MERGED=1; break; fi
            echo "合并未就绪，10s 后重试（$i/5）"
            sleep 10
          done
          if [ "$MERGED" = "1" ]; then
            echo "已自动合并：$PR_URL"
            sleep 3
            # GITHUB_TOKEN 执行的合并不会触发 push 事件，需手动触发部署
            gh workflow run pages.yml
            echo "已触发 pages.yml 部署"
          else
            echo "::warning::自动合并失败，PR 保留待人工处理：$PR_URL"
          fi
